# Retrieval ground truth for the news index (python -m scripts.eval_news), written against tests/data/news_snapshot.json,
# a frozen copy of 190 real Yahoo stories (MARKET, AAPL, NVDA, AM, AMD, SPY, SPCX feeds, captured 2026-10-01).
# `expect`: 8-character prefixes of the story ids that answer the question (the script checks they exist).
# `hints`: phrases, at least one of which must appear in a retrieved story's title + summary for the answer text itself to count as
#   found (hint@5). The script checks each question's hints appear in at least one expected story.
# kind answerable: a story answers it. kind out_of_scope: nothing finance-related to find. kind near_miss: a finance question on a topic
#   the snapshot does not cover; the right result is nothing found, but a dense embedding tends to return related stories.

