    - {q: "why would bonds go down when rates go up?", reference: "Existing bonds pay fixed coupons; when new bonds pay more, older bonds' prices fall to match.", key_points: ["fixed coupons", "new bonds pay more", "older bond prices fall"]}
    - {q: "how's my whole portfolio today?", reference: "The portfolio's value and change today, with the holdings' moves.", key_points: ["today's portfolio change", "holdings' moves"]}
