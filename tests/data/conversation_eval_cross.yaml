    - {q: "what is SCHD?", reference: "Schwab U.S. Dividend Equity ETF: a fund of US dividend-paying stocks; gives its yield, expense ratio or holdings from the data.", key_points: ["a dividend stock ETF", "its yield or expense ratio"]}
    - {q: "how much would $15,000 grow to at 5% a year for 15 years?", reference: "About $31,183.92.", key_points: ["about $31,184"]}
    - {q: "what's the communication services sector doing this month?", reference: "The communication services sector's return over the last month against the S&P 500, with its largest companies (GOOGL among them).", key_points: ["communication services return", "against the S&P 500"]}
    - {q: "how concentrated is my portfolio?", reference: "The concentration by holding and sector, and the diversification score.", key_points: ["largest holding weights", "sector concentration", "diversification score"]}

