# Cross-domain multi-turn conversations for scripts/eval_conversations.py --set cross: 30 chats of 10+ turns, each mixing
# portfolio, goals, market data, news, calculations and knowledge-base questions, with follow-ups ("and last month?",
# "which did better?"), topic switches and returns, typos as users type them ("profolio", "eft", "nvdia") and the odd
# off-topic or advice question. Same format and metrics as conversation_eval.yaml (see its header).
#
# Exact figures come from the app's own formulas (src/core/calculators.py): goals use the profile's return
# (conservative 4%, moderate 6%, aggressive 8%) compounded monthly; "X a year for N years" is compounded yearly.
# Live figures (prices, returns, portfolio values) change between runs, so their references say which figures a correct
# answer gives and the judge takes the values from the sources.

# ---------------------------------------------------------------- portfolios used below
_holdings:
  growth: &growth
    - {ticker: AAPL, shares: 15, cost_basis: 150, purchase_date: "2024-03-01"}
    - {ticker: VOO, shares: 10, cost_basis: 400, purchase_date: "2024-06-01"}
    - {ticker: NVDA, shares: 20, cost_basis: 90, purchase_date: "2024-09-03"}
    - {ticker: BND, shares: 30, cost_basis: 72, purchase_date: "2025-01-10"}
  tech: &tech
    - {ticker: MSFT, shares: 10, cost_basis: 350, purchase_date: "2024-02-01"}
    - {ticker: QQQ, shares: 8, cost_basis: 380, purchase_date: "2024-04-15"}
    - {ticker: JPM, shares: 12, cost_basis: 150, purchase_date: "2024-07-01"}
    - {ticker: VTI, shares: 15, cost_basis: 220, purchase_date: "2024-10-01"}
  bigtech: &bigtech
    - {ticker: TSLA, shares: 10, cost_basis: 200, purchase_date: "2024-05-01"}
    - {ticker: AMZN, shares: 12, cost_basis: 150, purchase_date: "2024-03-15"}
    - {ticker: GOOGL, shares: 10, cost_basis: 140, purchase_date: "2024-06-10"}
    - {ticker: SCHD, shares: 40, cost_basis: 25, purchase_date: "2024-11-01"}
  balanced: &balanced
    - {ticker: VTI, shares: 50, cost_basis: 200, purchase_date: "2023-06-01"}
    - {ticker: VXUS, shares: 40, cost_basis: 55, purchase_date: "2023-06-01"}
    - {ticker: BND, shares: 60, cost_basis: 73, purchase_date: "2023-06-01"}
  dividend: &dividend
    - {ticker: KO, shares: 30, cost_basis: 55, purchase_date: "2024-01-10"}
    - {ticker: JNJ, shares: 15, cost_basis: 160, purchase_date: "2024-01-10"}
    - {ticker: PG, shares: 10, cost_basis: 145, purchase_date: "2024-01-10"}
    - {ticker: VYM, shares: 20, cost_basis: 105, purchase_date: "2024-01-10"}

conversations:

- id: x01-new-investor
  title: A new investor - portfolio, ETFs, today's market and a retirement goal
  profile: {knowledge_level: beginner, risk_tolerance: moderate, horizon_years: 25}
  holdings: *growth
  turns:
    - {q: "describe my profolio?", reference: "The portfolio's total value, gain or loss against cost, today's change, and its four holdings (AAPL, VOO, NVDA, BND) with their weights, diversification and risk against the moderate tolerance.", key_points: ["total value", "gain or loss against cost", "the holdings and their weights", "diversification or risk"]}
    - {q: "What is eft?", reference: "An exchange-traded fund (ETF): a fund holding a basket of assets that trades on an exchange like a stock, giving diversification usually at low cost. It reads 'eft' as ETF.", key_points: ["reads it as ETF", "a fund holding many assets", "trades on an exchange like a stock"]}
    - {q: "which of my holdings are etfs?", reference: "VOO (an S&P 500 index fund) and BND (a bond fund) are the ETFs; AAPL and NVDA are single stocks.", key_points: ["VOO is an ETF", "BND is an ETF", "AAPL and NVDA are stocks"]}
    - {q: "how's VOO performance today?", reference: "VOO's price today and its change versus the previous close.", key_points: ["VOO's price", "VOO's change today"]}
    - {q: "how's the market today and last month?", reference: "The S&P 500, Nasdaq and Dow's change today, and their returns over the last month, kept apart (today's change and the month's return are different periods).", key_points: ["indices' change today", "indices' returns over the last month", "keeps the two periods apart"]}
    - {q: "did VOO beat the S&P 500 last month?", reference: "VOO tracks the S&P 500, so its last-month return is nearly the same as the index's; gives both returns over the last month.", key_points: ["VOO's last-month return", "the S&P 500's last-month return", "notes VOO tracks the S&P 500"]}
    - {q: "what is an expense ratio?", reference: "The yearly fee a fund charges, as a percentage of the money invested (0.03% of $10,000 is $3 a year).", key_points: ["a yearly fund fee", "a percentage of assets invested", "an example in dollars"]}
    - {q: "what's VOO's expense ratio?", reference: "VOO's expense ratio from the data, about 0.03%.", key_points: ["VOO's expense ratio"]}
    - {q: "I want to retire with $1 million in 25 years, how much should I save monthly?", reference: "At the moderate 6% return, compounded monthly, about $1,443.02 a month.", key_points: ["about $1,443 a month", "assumes 6% a year"]}
    - {q: "what if I already have $50,000 saved?", reference: "With $50,000 already saved, at 6% for 25 years, about $1,120.87 a month.", key_points: ["about $1,121 a month", "accounts for the $50,000"]}
    - {q: "is my portfolio too risky for that goal?", reference: "Compares the portfolio's risk level and concentration (NVDA, tech) with the moderate tolerance stated for the goal, without telling the user what to buy or sell.", key_points: ["the portfolio's risk level", "against the moderate tolerance", "concentration noted", "no buy/sell advice"]}

- id: x02-tech-holder
  title: Tech-heavy portfolio - concentration, sectors and a comparison
  profile: {knowledge_level: intermediate, risk_tolerance: aggressive, horizon_years: 20}
  holdings: *tech
  turns:
    - {q: "how is my portfolio doing?", reference: "Total value, gain or loss against cost, today's change, the four holdings (MSFT, QQQ, JPM, VTI), diversification and risk.", key_points: ["total value", "gain or loss", "today's change", "covers MSFT, QQQ, JPM and VTI"]}
    - {q: "how much of it is tech?", reference: "The technology share of the portfolio once the funds' holdings are counted (QQQ and VTI hold large tech weights).", key_points: ["the technology percentage", "counts tech inside QQQ and VTI"]}
    - {q: "what does QQQ track?", reference: "QQQ tracks the Nasdaq-100: the 100 largest non-financial companies on the Nasdaq, heavy in technology.", key_points: ["the Nasdaq-100", "large non-financial Nasdaq companies", "tech-heavy"]}
    - {q: "how is the tech sector doing?", reference: "The technology sector's return over the last month (its sector fund) against the S&P 500, and its largest companies' moves.", key_points: ["tech sector's return", "against the S&P 500", "largest companies' moves"]}
    - {q: "and financials?", reference: "The financial sector's return over the same period against the S&P 500, with its largest companies.", key_points: ["financial sector's return", "against the S&P 500", "same period as before"]}
    - {q: "how did JPM do over the last 6 months?", reference: "JPMorgan's total return over the last 6 months with start and end prices, high and low.", key_points: ["JPM's 6-month return", "start and end prices"]}
    - {q: "compare it to MSFT", reference: "JPM's and Microsoft's 6-month returns side by side, as a table.", key_points: ["JPM's 6-month return", "MSFT's 6-month return", "same period for both"]}
    - {q: "which did better?", reference: "Names whichever of JPM and MSFT had the higher 6-month return, with both returns.", key_points: ["names the better one", "both returns"]}
    - {q: "what is diversification?", reference: "Spreading money across many investments, sectors or asset types so one bad holding hurts less.", key_points: ["spreading across investments", "reduces the impact of any one holding"]}
    - {q: "am i diversified enough?", reference: "The portfolio's diversification score and what it means, its overlap between QQQ, VTI and MSFT, and its tech concentration.", key_points: ["the diversification score", "overlap or concentration", "what the score means"]}
    - {q: "should I sell MSFT?", reference: "Declines to say whether to sell, and explains the ideas behind such a decision (concentration, goals, taxes) with facts about the holding.", key_points: ["declines buy/sell advice", "explains what to consider"]}

- id: x03-dividends
  title: Dividend portfolio - yield, income maths and dividend stocks
  profile: {knowledge_level: beginner, risk_tolerance: conservative, horizon_years: 15}
  holdings: *dividend
  turns:
    - {q: "show me a summary of my portfolio", reference: "Total value, gain or loss against cost, today's change, the holdings (KO, JNJ, PG, VYM), diversification, risk and dividends.", key_points: ["total value", "gain or loss", "the four holdings", "dividends or income"]}
    - {q: "what is a dividend yield?", reference: "Yearly dividends per share divided by the share price, as a percentage (a $2 dividend on a $50 share is 4%).", key_points: ["annual dividends divided by price", "a percentage", "an example"]}
    - {q: "what's KO's dividend yield?", reference: "Coca-Cola's dividend yield from the data.", key_points: ["KO's dividend yield"]}
    - {q: "how much income would $50,000 make at a 3.5% yield?", reference: "$50,000 × 3.5% = $1,750 a year (about $146 a month).", key_points: ["$1,750 a year"]}
    - {q: "how is KO doing today?", reference: "Coca-Cola's price today and its change versus the previous close.", key_points: ["KO's price", "KO's change today"]}
    - {q: "and over the last year?", reference: "Coca-Cola's total return over the last year with start and end prices.", key_points: ["KO's 1-year return", "start and end prices"]}
    - {q: "what does VYM hold?", reference: "VYM is Vanguard's High Dividend Yield ETF: US stocks with above-average dividend yields; gives its top holdings or sectors and yield from the data.", key_points: ["a high-dividend-yield stock fund", "top holdings or sectors", "its yield or expense ratio"]}
    - {q: "are dividends taxed?", reference: "In the US, qualified dividends are taxed at the lower long-term capital-gains rates (0%, 15% or 20%); ordinary dividends at income-tax rates; not taxed inside tax-advantaged accounts like a Roth IRA.", key_points: ["qualified vs ordinary dividends", "qualified at capital-gains rates", "ordinary at income rates"]}
    - {q: "how did the consumer staples sector do last month?", reference: "The consumer staples sector's return over the last month against the S&P 500, with its largest companies.", key_points: ["consumer staples return", "against the S&P 500", "largest companies"]}
    - {q: "I want $500,000 in 20 years, how much do I need to save each month?", reference: "At the conservative 4% return, compounded monthly, about $1,363.24 a month.", key_points: ["about $1,363 a month", "assumes 4% a year"]}
    - {q: "what if I gave it 25 years instead?", reference: "Over 25 years at 4%, about $972.52 a month.", key_points: ["about $973 a month", "25 years"]}

- id: x04-market-day
  title: A day in the market - indices, movers, news and a company
  profile: {knowledge_level: intermediate, risk_tolerance: moderate, horizon_years: 10}
  turns:
    - {q: "how's the stock market today?", reference: "The S&P 500, Nasdaq and Dow's change today versus the previous close, and whether the market is up or down overall.", key_points: ["S&P 500 today", "Nasdaq today", "Dow today", "up or down overall"]}
    - {q: "and over the last month?", reference: "The same indices' returns over the last month, with the sectors ranked if given.", key_points: ["indices' last-month returns", "a month, not today"]}
    - {q: "which sectors did best?", reference: "The sectors ranked by return over the last month, naming the best and worst.", key_points: ["names the best sectors", "names the worst", "their returns"]}
    - {q: "what are today's most active stocks?", reference: "Today's most traded US stocks by volume, with price and change.", key_points: ["lists the most active stocks", "price and change"]}
    - {q: "any news about the market today?", reference: "Today's market headlines with publishers, summarised only from the stories.", key_points: ["several market headlines", "publishers"]}
    - {q: "how is nvdia doing today?", reference: "NVIDIA's price today and change versus the previous close (reads 'nvdia' as NVIDIA).", key_points: ["reads it as NVIDIA", "NVDA's price", "NVDA's change today"]}
    - {q: "how does that compare with the nasdaq?", reference: "NVIDIA's change today against the Nasdaq's change today, in a table, and which did better today.", key_points: ["NVDA's change today", "Nasdaq's change today", "which did better today"]}
    - {q: "what is market cap?", reference: "Market capitalisation: share price times shares outstanding, the market value of a company.", key_points: ["price times shares outstanding", "a company's market value"]}
    - {q: "what's nvidia's market cap?", reference: "NVIDIA's market capitalisation from the data.", key_points: ["NVDA's market cap"]}
    - {q: "is the market open right now?", reference: "Whether the US stock market is open or closed now, with its trading hours.", key_points: ["open or closed", "trading hours"]}
    - {q: "what are the 10 biggest US companies?", reference: "The 10 largest US-listed companies by market value and how each moved.", key_points: ["lists the largest companies", "by market value"]}

- id: x05-retirement-mix
  title: Retirement planning with tax accounts, a calculation and the market
  profile: {knowledge_level: beginner, risk_tolerance: moderate, horizon_years: 30}
  holdings: *balanced
  turns:
    - {q: "what is a 401k?", reference: "A US employer-sponsored retirement account: contributions are usually pre-tax, often with an employer match, and taxed when withdrawn in retirement.", key_points: ["employer-sponsored retirement account", "pre-tax contributions", "taxed on withdrawal", "employer match"]}
    - {q: "roth or traditional - what's the difference?", reference: "Traditional: tax deduction now, taxed on withdrawal. Roth: after-tax contributions, qualified withdrawals tax-free.", key_points: ["traditional taxed on withdrawal", "Roth contributions after-tax", "Roth qualified withdrawals tax-free"]}
    - {q: "describe my portfolio", reference: "Total value, gain or loss against cost, today's change, the three funds (VTI, VXUS, BND) and their weights, diversification and risk.", key_points: ["total value", "gain or loss", "VTI, VXUS and BND with weights", "diversification or risk"]}
    - {q: "what's the stock/bond split?", reference: "The share in stocks (VTI, VXUS) versus bonds (BND) from the portfolio data.", key_points: ["stock percentage", "bond percentage"]}
    - {q: "how much will $500 a month grow to over 30 years at 7%?", reference: "$500 a month for 30 years at 7%, compounded monthly, grows to about $609,985.50.", key_points: ["about $609,986", "monthly contributions compounding"]}
    - {q: "I want $1.5 million in 30 years and I have $25,000 saved - how much a month?", reference: "At the moderate 6% return, about $1,343.38 a month.", key_points: ["about $1,343 a month", "uses the $25,000 saved", "6% a year"]}
    - {q: "and if I'm conservative?", reference: "At the conservative 4% return, about $2,041.88 a month, more than at 6%.", key_points: ["about $2,042 a month", "4% conservative return", "higher than before"]}
    - {q: "how did bonds do last month?", reference: "BND's (or the bond market's) return over the last month with start and end prices.", key_points: ["the bond fund's last-month return"]}
    - {q: "and the S&P 500?", reference: "The S&P 500's return over the same last month.", key_points: ["S&P 500's last-month return", "same period"]}
    - {q: "what is rebalancing?", reference: "Bringing a portfolio back to its target mix by selling what grew above target and buying what fell below, keeping risk where intended.", key_points: ["back to a target mix", "sell above target, buy below", "keeps risk on target"]}
    - {q: "rebalance my portfolio to 60/40 for me", reference: "Declines to change the portfolio (read-only) and may explain how to do it.", key_points: ["can't change the portfolio"]}

- id: x06-house-goal
  title: Saving for a house - goal, mortgage maths and rates
  profile: {knowledge_level: beginner, risk_tolerance: moderate, horizon_years: 5}
  turns:
    - {q: "I need $100,000 for a house down payment in 5 years, how much should I save monthly?", reference: "At the moderate 6% return, about $1,433.29 a month.", key_points: ["about $1,433 a month", "6% a year"]}
    - {q: "I already have $10,000 put away", reference: "With $10,000 already saved, about $1,239.96 a month for 5 years at 6%.", key_points: ["about $1,240 a month", "uses the $10,000"]}
    - {q: "what's the monthly payment on a $300,000 30-year mortgage at 6.5%?", reference: "About $1,896.20 a month (principal and interest).", key_points: ["about $1,896 a month"]}
    - {q: "what is APR?", reference: "Annual percentage rate: the yearly cost of a loan including interest and certain fees, for comparing loans.", key_points: ["yearly cost of borrowing", "includes fees", "for comparing loans"]}
    - {q: "what are the 10-year treasury yields today?", reference: "The 10-year US Treasury yield today and its change.", key_points: ["10-year yield", "its change"]}
    - {q: "how do treasury yields affect mortgage rates?", reference: "Mortgage rates tend to follow the 10-year Treasury yield: when yields rise, mortgage rates usually rise too.", key_points: ["mortgage rates track the 10-year yield", "move in the same direction"]}
    - {q: "what's a high-yield savings account?", reference: "A savings account paying a higher interest rate than standard savings, usually online, and insured by the FDIC.", key_points: ["higher interest than standard savings", "insured / low risk"]}
    - {q: "should I keep the down payment in stocks?", reference: "Declines to advise; explains that money needed in a few years is usually exposed to stock swings, and the trade-off of risk and return.", key_points: ["no personal advice", "short horizon vs stock volatility"]}
    - {q: "how much would $20,000 at 4% compounded monthly be after 5 years?", reference: "About $24,419.93.", key_points: ["about $24,420"]}
    - {q: "how is the real estate sector doing?", reference: "The real estate sector's return over the last month against the S&P 500, with its largest companies.", key_points: ["real estate sector's return", "against the S&P 500"]}
    - {q: "what is a REIT?", reference: "A real estate investment trust: a company that owns income-producing property and pays out most of its income as dividends; shares trade like stocks.", key_points: ["owns income-producing real estate", "pays most income as dividends", "trades like a stock"]}

