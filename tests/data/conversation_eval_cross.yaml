- id: x09-compound-learning
  title: Learning compounding with calculations, then applying it to a real fund
  profile: {knowledge_level: beginner, risk_tolerance: moderate, horizon_years: 20}
  turns:
    - {q: "What is compound interest?", reference: "Interest earned on the principal and on interest already added, so growth speeds up over time.", key_points: ["interest on interest", "grows faster than simple interest"]}
    - {q: "How much will $10,000 grow to at 7% a year for 20 years?", reference: "$38,696.84.", key_points: ["about $38,697"]}
    - {q: "and $5,000 at 6% for 10 years?", reference: "$8,954.24.", key_points: ["about $8,954"]}
    - {q: "how long does it take to double my money at 8%?", reference: "About 9 years (rule of 72: 72 / 8 = 9; exactly about 9.01 years).", key_points: ["about 9 years", "rule of 72"]}
    - {q: "what is the rule of 72?", reference: "Divide 72 by the yearly return to estimate the years to double money.", key_points: ["72 divided by the rate", "years to double"]}
    - {q: "what is an index fund?", reference: "A fund that tracks a market index (like the S&P 500) instead of picking stocks, usually with low fees.", key_points: ["tracks an index", "low fees", "passive"]}
    - {q: "how has the S&P 500 done this year?", reference: "The S&P 500's year-to-date return.", key_points: ["S&P 500 year-to-date return"]}
    - {q: "and over the last 5 years?", reference: "The S&P 500's return over the last 5 years, with the annualised return if given.", key_points: ["5-year return", "annualised if given"]}
    - {q: "what's the CAGR if $10,000 grew to $15,000 in 5 years?", reference: "About 8.45% a year.", key_points: ["about 8.45%"]}
    - {q: "what is inflation?", reference: "The general rise in prices over time, which lowers what money buys.", key_points: ["prices rising", "money buys less"]}
    - {q: "what's the real return if I earn 7% and inflation is 3%?", reference: "About 3.88% ((1.07 / 1.03) - 1), roughly 4%.", key_points: ["about 3.9%"]}

- id: x10-switching-topics
  title: Jumping between topics and coming back
  profile: {knowledge_level: intermediate, risk_tolerance: moderate, horizon_years: 15}
  holdings: *growth
  turns:
    - {q: "how's apple doing today?", reference: "Apple's price today and its change versus the previous close.", key_points: ["AAPL's price", "AAPL's change today"]}
    - {q: "what is a bond?", reference: "A loan to a government or company that pays interest and returns the principal at maturity.", key_points: ["a loan to an issuer", "pays interest", "principal back at maturity"]}
    - {q: "back to apple - how did it do last month?", reference: "Apple's return over the last month with start and end prices.", key_points: ["AAPL's last-month return"]}
    - {q: "how many apple shares do I own?", reference: "15 shares of AAPL, with their current value.", key_points: ["15 shares", "their value"]}
    - {q: "what's my total gain on apple?", reference: "The gain or loss on the AAPL holding against its $150 cost basis.", key_points: ["AAPL gain or loss", "against cost basis"]}
    - {q: "what is a stock split?", reference: "A company divides each share into several, lowering the price per share without changing the total value.", key_points: ["more shares at a lower price", "same total value"]}
