# Calculator chain eval (python -m scripts.eval_calc_chains): 30 conversations of three messages, each follow-up changing
# or building on the one before, replayed through the real workflow with the real model and the conversation's memory
# carried between messages as in the app.
# `expect`: one entry per message, a list of groups of acceptable values. Each group must match a number in the reply
#   within 0.5% (a rate may be written as a decimal or a percentage; a count of months or years within 0.5 of it).
#   Alternatives in a group cover legitimate modelling choices (payments at the start or the end of a period,
#   compounding monthly or yearly) or rounding (31.9 months, or 32 payments). An empty list checks nothing.
# References were worked out in Python from the standard formulas (loan payment, annuity present and future value,
# compound growth, a month-by-month payoff that pays at most what is owed), not with Finnie's calculators.
# 2026-11-27: first version. c01, c06, c12 and c15 are the four chains Kevin tried by hand.

# ---------------------------------------------------------------- loans
- id: c01
  about: mortgage, a lower rate, then $200 a month extra
  messages:
    - "I'm borrowing $350,000 for a house on a 30-year fixed mortgage at 6.5%. What will my monthly payment be?"
    - "What if the rate is 5.5% instead?"
    - "And what if I pay an extra $200 a month on top of that? How much sooner is it paid off and how much interest do I save?"
  expect:
    - [[2212.24]]
    - [[1987.26]]
    - [[70, 71], [83056.56]]          # 290 payments vs 360 (289.1 by the formula, 70.9 sooner)

- id: c02
