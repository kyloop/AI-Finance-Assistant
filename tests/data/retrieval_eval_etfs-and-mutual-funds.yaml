  - Launched January 22, 1993
  - Tracks the S&P 500

- id: q29
  band: M
  q: What is a wrap account and what are the benefits?
  expect:
  - 'wrap-account :: Structure'
  - 'wrap-account :: (lead)'
  hints:
  - they only have one counterparty to deal with
  reference: 'A wrap account (wrap service) lets an investor, usually with an adviser, choose from many funds and assets and place them
    in the right tax wrappers. Benefits: one counterparty to deal with, the whole portfolio viewable in one place, and a single consolidated
    tax statement and regular statements.'
  key_points:
  - Choose from a wide range of funds and assets in one account
  - Only one counterparty to deal with
  - Whole portfolio viewable in one place
  - Single consolidated tax statement

- id: q30
  band: S
  q: What is UCITS?
  expect:
  - 'undertakings-for-collective-investment-in-transferable-securities-directive-2009 :: (lead)'
  hints:
  - operate freely throughout the eu
  reference: UCITS (Directive 2009/65/EC) is a European Union directive that lets collective investment schemes operate freely across
    the EU on the basis of a single authorisation from one member state. Member states may add extra requirements to protect investors.
  key_points:
  - An EU directive for collective investment schemes
  - One authorisation from a member state lets the fund operate across the EU
  - Member states may add extra investor protections

- id: q31
  band: S
  q: What is a sector fund?
  expect:
  - 'stock-fund :: Fund types > Sector fund'
  hints:
  - a fund that invests in one area of industry is called a sector fund
  reference: A sector fund invests in one area of industry, with most keeping at least 25% of assets in its specialty. Examples are
    gold, technology and utility funds. They offer high appreciation potential but also higher risk.
  key_points:
  - Invests in one area of industry
  - 'Examples: gold, technology, utility funds'
  - Higher potential appreciation but higher risk

- id: q32
  band: L
  q: How does Lipper rate mutual funds?
  expect:
  - 'lipper :: Fund ratings and indices'
  hints:
  - the highest 20% of funds in each peer group are named lipper leaders
  reference: The Lipper Leaders Rating System rates funds from 5 (highest) to 1 against peers using criteria such as total return, consistent
    return, capital preservation, tax efficiency and expense. The top 20% of a peer group get a 5 (Lipper Leaders), the next 20% a 4,
