- id: q21
  band: XL
  q: What is a callable bond?
  expect:
  - 'callable-bond :: (lead)'
  hints:
  - redeeming the bond at some point before
  reference: A callable bond lets the issuer redeem (buy back) the bond before maturity at a set call price, usually above par. Issuers tend to call when interest rates fall; to compensate investors for this risk, callable bonds pay a higher coupon.
  key_points:
  - The issuer can redeem the bond before maturity
  - At a call price usually above par
  - Investors get a higher coupon in return

- id: q22
  band: S
  q: How do I calculate a bond's current yield?
  expect:
  - 'current-yield :: (lead)'
  - 'current-yield :: Example'
  hints:
  - ratio of the annual interest
  reference: Current yield = the bond's annual interest (coupon) payment divided by its current market price.
  key_points:
  - Current yield = annual interest payment / current price
  - Uses the market price, not face value

- id: q23
  band: L
  q: What is a convertible bond?
  expect:
  - 'convertible-bond :: (lead)'
  hints:
  - convert into a specified number of shares
  reference: A convertible bond is a bond the holder can convert into a set number of the issuer's shares (or their cash value). It's a hybrid with debt and equity features, and because of the conversion option it usually pays a lower interest rate than a regular bond.
  key_points:
  - Can be converted into a set number of the issuer's shares
  - Hybrid of debt and equity
  - Usually pays a lower rate in exchange for the conversion option

- id: q24
  band: S
  q: What is a floating rate note?
  expect:
  - 'floating-rate-note :: (lead)'
  hints:
  - variable coupon
  reference: A floating rate note (FRN) is a bond with a variable coupon equal to a money-market reference rate (such as SOFR) plus a fixed spread. Most pay quarterly, and the coupon resets at the start of each period.
  key_points:
  - Coupon varies with a reference rate (e.g. SOFR)
  - Plus a fixed spread
  - Usually pays quarterly and resets each period

- id: q25
  band: XL
  q: What is a mortgage-backed security?
  expect:
  - 'mortgage-backed-security :: (lead)'
  hints:
  - secured by a mortgage or collection of mortgages
  reference: 'A mortgage-backed security (MBS) is an asset-backed security secured by a pool of mortgages: the loans are bundled (securitized) into a security investors can buy, and borrowers'' interest and principal payments pass through to the investors.'
  key_points:
  - Secured by a pool of mortgages
  - Mortgages are bundled (securitized) into a tradable security
  - Borrowers' payments pass through to investors

- id: q26
  band: L
  q: What is a green bond?
  expect:
  - 'green-bond :: (lead)'
  hints:
  - positive environmental benefits
  reference: A green bond is a bond whose proceeds fund projects with environmental benefits, such as renewable energy, energy efficiency or clean transport. Green bonds follow the ICMA Green Bond Principles.
  key_points:
  - Funds projects with environmental benefits
  - 'Examples: renewable energy, energy efficiency, clean transport'
  - Follows the Green Bond Principles

- id: q27
  band: S
  q: What is a bond ladder?
  expect:
  - 'laddering :: (lead)'
  - 'laddering :: Types of laddering > Bond laddering'
  hints:
  - different maturity dates
  reference: Laddering means buying several bonds (or other products) that mature at different dates, the 'rungs'. This spreads out maturities, giving diversification and more stable yields.
  key_points:
  - Buy several bonds with different maturity dates
  - Each maturity is a 'rung'
  - Provides diversification and more stable yield

- id: q28
  band: M
  q: What is a general obligation bond?
  expect:
  - 'general-obligation-bond :: (lead)'
  hints:
  - pledge to use legally-available resources
  reference: A general obligation bond is a U.S. municipal bond backed by the government's pledge to use its available resources, including tax revenue (often property taxes), to repay bondholders. Rating agencies usually see this pledge as very strong credit quality.
  key_points:
  - A municipal bond backed by the issuer's general resources
  - Including taxes (often a property tax pledge)
  - Usually considered very strong credit quality

- id: q29
  band: S
  q: What is reinvestment risk?
  expect:
  - 'reinvestment-risk :: (lead)'
  - 'reinvestment-risk :: Coupon reinvestment'
  - 'reinvestment-risk :: Early redemption'
  hints:
  - early redemption risk and coupon reinvestment risk
  reference: Reinvestment risk is the risk that money you get back from a fixed-income investment, through early redemption or coupon payments, has to be reinvested at lower rates.
  key_points:
  - Mainly affects bonds and other fixed income
  - Comes from early redemption and from reinvesting coupons
  - Money may have to be reinvested at lower rates

- id: q30
  band: L
  q: What is commercial paper?
  expect:
  - 'commercial-paper :: (lead)'
  hints:
  - unsecured promissory note
  reference: Commercial paper is an unsecured, short-term promissory note (usually under 270 days) that large companies issue to fund short-term needs like payroll. Because it isn't backed by collateral, only firms with excellent credit ratings can issue it at a reasonable cost.
  key_points:
  - Unsecured promissory note
  - Short maturity, usually under 270 days
  - Issued by large companies for short-term needs
  - Only highly rated firms can issue it cheaply
