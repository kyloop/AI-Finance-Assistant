- id: q21
  band: S
  q: How do I calculate my net worth?
  expect:
  - 'net-worth :: By entity > Calculation'
  - 'net-worth :: By entity > Individuals'
  hints:
  - excess of assets over liabilities
  - assets minus liabilities
  reference: Net worth is your assets minus your liabilities. Assets include your home, vehicles, bank and money market accounts, stocks, bonds and retirement accounts; liabilities include loans, mortgages and other debts.
  key_points:
  - Net worth = assets minus liabilities
  - Assets include home, vehicles, bank accounts, investments
  - Liabilities include loans, mortgages and other debts

- id: q22
  band: M
  q: What is a real interest rate and how is it different from the nominal rate?
  expect:
  - 'real-interest-rate :: (lead)'
  - 'nominal-interest-rate :: Nominal versus real interest rate'
  - 'real-and-nominal-value :: Real interest rates'
  hints:
  - Fisher equation
  - nominal interest rate minus inflation
  reference: 'The real interest rate is the nominal interest rate adjusted for inflation: approximately the nominal rate minus the inflation rate (the Fisher equation). Looking back, it''s the nominal rate minus actual inflation; looking ahead, the nominal rate minus expected inflation.'
  key_points:
  - Real rate ≈ nominal rate minus inflation
  - This approximation is the Fisher equation
  - Ex post uses actual inflation; expected real rate uses expected inflation

- id: q23
  band: M
  q: Is deflation good or bad for savers?
  expect:
  - 'deflation :: Effects > On savings and investments'
  hints:
  - rewarded by saving and holding money
  reference: Savers holding money are rewarded under deflation, because money gains value as prices fall. But deflation discourages investment and spending, which can cause a collapse in demand, and most economists see this hoarding as undesirable.
  key_points:
  - Holding money is rewarded because its value rises
  - Deflation discourages investment and spending
  - Hoarding can deepen a deflationary spiral and is seen as undesirable

- id: q24
  band: L
  q: Does a loan's APR include all the fees I will pay?
  expect:
  - 'annual-percentage-rate :: Failings in the United States > Certain fees are not considered'
  hints:
  - not included in the calculation of APR
  reference: No. Some fees are deliberately left out of the APR, such as one-time fees paid to third parties (e.g. a real estate attorney) and penalties like late fees, so the APR may not show the total cost of borrowing.
  key_points:
  - Some fees are excluded from APR
  - 'Examples: third-party one-time fees, late fees and other penalties'
  - So APR may understate the total cost of borrowing

- id: q25
  band: L
  q: How long will it take my money to double at 9% interest?
  expect:
  - 'rule-of-72 :: Using the rule to estimate compounding periods'
  - 'rule-of-72 :: (lead)'
  hints:
  - 72/9 = 8 years
  - divided by the interest percentage
  reference: 'About 8 years, by the rule of 72: divide 72 by the interest rate (72 / 9 = 8). The exact figure with compound interest is about 8.04 years.'
  key_points:
  - 'Use the rule of 72: divide 72 by the rate'
  - 72 / 9 = about 8 years
  - Exact calculation gives about 8.04 years

- id: q26
  band: XL
  q: How do central banks fight deflation?
  expect:
  - 'deflation :: Counteracting deflation'
  hints:
  - quantitative easing
  reference: Lowering interest rates may not be enough, since even a zero rate can leave real rates too high, and negative rates are limited. So central banks set a target for the quantity of money (quantitative easing), for example by buying financial assets such as mortgage-backed securities.
  key_points:
  - Cutting interest rates may be ineffective in severe deflation
  - Negative rates can only go so far
  - Central banks use quantitative easing to increase the money supply
  - E.g. buying assets such as mortgage-backed securities

- id: q27
  band: M
  q: What is opportunity cost?
  expect:
  - 'opportunity-cost :: (lead)'
  hints:
  - value of the best alternative forgone
  reference: Opportunity cost is the value of the best alternative you give up when you make a choice. It includes explicit and implicit costs and isn't limited to money; lost time or pleasure counts too.
  key_points:
  - The value of the best alternative given up
  - Arises because choices are mutually exclusive with limited resources
  - 'Not limited to money: time and other benefits count'

- id: q28
  band: L
  q: What is net present value?
  expect:
  - 'net-present-value :: (lead)'
  hints:
  - positive NPV
  reference: Net present value (NPV) compares the present value of an investment's expected future cash flows with its cost today, converting future money into today's value because money now is worth more than later. A positive NPV means the expected benefits exceed the cost, so it is likely to create value.
  key_points:
  - Converts future cash flows to present value
  - Compares that with the cost of the investment today
  - Positive NPV means benefits exceed the cost

- id: q29
  band: M
  q: What is a capital gain?
  expect:
  - 'capital-gain :: (lead)'
  hints:
  - profit earned on the sale of an asset
  reference: A capital gain is the profit from selling an asset (such as shares or property) for more than you paid for it. If you sell for less, it's a capital loss. Capital gains are often taxed, with rates that differ by country.
  key_points:
  - Profit when an asset sells for more than its purchase price
  - Selling for less is a capital loss
  - Capital gains are often taxed

- id: q30
  band: L
  q: How does borrowing to invest (leverage) increase risk?
  expect:
  - 'leverage-finance :: (lead)'
  - 'leverage-finance :: Risk'
  hints:
  - risk of not being able to pay back
  reference: 'Leverage means investing with borrowed money, which magnifies the outcome: if the investment does well profits can be large, but if it does badly you may be unable to repay the borrowed money. Lenders limit how much leverage they allow and often require the asset as collateral.'
  key_points:
  - Leverage is borrowing to invest
  - It magnifies gains
  - It risks being unable to repay the loan
  - Lenders limit leverage and often require collateral

- id: q31
  band: L
  q: What is hyperinflation?
  expect:
  - 'hyperinflation :: (lead)'
  - 'hyperinflation :: Definition'
  hints:
  - very high and typically accelerating inflation
  reference: Hyperinflation is very high and usually accelerating inflation that quickly erodes the value of a currency as all prices rise, so people switch to more stable foreign currencies. Capital controls and adopting a foreign currency are the usual ways to end it, at significant cost.
  key_points:
  - Very high, accelerating inflation
  - Quickly erodes the currency's real value
  - People switch to more stable foreign currencies

- id: q32
  band: L
  q: What is stagflation?
  expect:
  - 'stagflation :: (lead)'
  hints:
  - high inflation, stagnant economic growth
  reference: Stagflation is the combination of high inflation, stagnant economic growth and high unemployment. It became widely known after 1970s shocks such as the 1973 oil crisis, and it is a policy dilemma because fighting inflation can worsen unemployment.
  key_points:
  - High inflation with stagnant growth and high unemployment
  - Became prominent in the 1970s (e.g. 1973 oil crisis)
  - Creates a policy dilemma

- id: q33
  band: L
  q: Why does fiat money have value?
  expect:
  - 'money :: Types > Fiat'
  - 'fiat-money :: (lead)'
  hints:
  - 'not derived from any intrinsic value'
  - agree on its value
  reference: Fiat money is government-issued currency that isn't backed by gold or any commodity. It has value because people agree on its value and trust that it will be accepted as payment. All major currencies have been fiat money since the end of the Bretton Woods system.
  key_points:
  - Not backed by gold, silver or another commodity
  - Valuable because people agree on its value and trust it will be accepted
  - All major currencies are fiat since Bretton Woods ended

- id: q34
  band: L
  q: Why are loans with collateral cheaper?
  expect:
  - 'collateral-finance :: (lead)'
  hints:
  - lower interest rate on loans that have collateral
  reference: Collateral is property a borrower pledges to secure a loan; the lender can take it if the borrower defaults. Because that protects the lender, secured loans usually carry lower interest rates, sometimes several percentage points lower than unsecured loans.
  key_points:
  - Collateral is property pledged to secure a loan
  - The lender can claim it if the borrower defaults
  - This protection allows lower interest rates

- id: q35
  band: M
  q: What does a central bank do?
  expect:
  - 'central-bank :: (lead)'
  - 'central-bank :: Definition'
  hints:
  - manages the monetary policy
  reference: A central bank manages a country's monetary policy and has a monopoly on increasing the monetary base. Many also supervise commercial banks to keep them stable and prevent bank runs, and enforce rules against fraud and money laundering.
  key_points:
  - Manages monetary policy
  - Has a monopoly on increasing the monetary base
  - Often supervises commercial banks for stability

- id: q36
  band: L
  q: What is disposable income?
  expect:
  - 'disposable-income :: (lead)'
  - 'disposable-income :: Meanings of disposable income'
  hints:
  - personal income minus current taxes
  reference: 'Disposable income is your total personal income minus current income taxes. It''s what''s left to spend or save: consumption spending plus saving equals disposable income.'
  key_points:
  - Personal income minus income taxes
  - Available for spending and saving
  - Consumption plus savings equals disposable income

- id: q37
  band: S
  q: How is return on investment calculated?
  expect:
  - 'return-on-investment :: (lead)'
  - 'return-on-investment :: Calculation'
  hints:
  - ratio between net income or profit to investment
  reference: Return on investment (ROI) is the net profit from an investment divided by its cost. A high ROI means the gains compare favorably to the cost, and it's used to compare the efficiency of different investments.
  key_points:
  - ROI = net profit divided by the investment's cost
  - A higher ROI means better gains relative to cost
  - Used to compare investments
