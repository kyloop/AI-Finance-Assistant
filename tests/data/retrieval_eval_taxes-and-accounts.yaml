  - 'income-tax-in-the-united-states :: Basics > Effective income tax rates'
  hints:
  - percent of their income that an individual or a corporation pays in taxes
  reference: The effective tax rate is the share of total income paid in taxes, while the marginal rate is the rate on the next dollar earned; in a progressive system the effective rate is below the top
