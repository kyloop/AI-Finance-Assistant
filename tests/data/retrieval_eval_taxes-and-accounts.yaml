  hints:
  - Eligible taxes include state and local income taxes and property taxes
  reference: Property taxes are deductible through the state and local tax (SALT) deduction, an itemized deduction covering state and local income and property taxes. It was capped at $10,000 for 2018-2025,
    and only helps taxpayers who itemize.
  key_points:
  - Property taxes count toward the SALT deduction
  - SALT is an itemized deduction
  - The deduction is capped
