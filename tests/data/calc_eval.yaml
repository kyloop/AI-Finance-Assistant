# Calculator eval (python -m scripts.eval_calc): questions with reference answers, run against the live LLM to measure how
# often it designs a correct calculation plan (mds/calc-plan-design.md, guard 6). References come from
# src/core/calculators.py or are computed by hand (noted).
# `expect`: groups of acceptable values; every group must match some step result of the executed plan within 0.5%
#   (a rate may match as a decimal or a percentage). Alternatives in one group cover legitimate modelling choices
#   (deposits at the start or the end of a period), which the plan states in its assumptions.
# `status: need_info`: the right answer is to ask for the numbers.

- {id: c01, q: "If I invest $1,000 in 5 different stocks, how much is in each stock?", expect: [[200]]}
- {id: c02, q: "You have $10,000 to invest. You put 50% of it into a broad market index fund, 30% into a technology stock, and the remaining 20% into a crypto fund. How much money goes into each asset?", expect: [[5000], [3000], [2000]]}
- {id: c03, q: "If you decide to save $600 every month and split it equally into 3 different retirement accounts, how much money goes into each account each month? And how much does each account grow to with 6% interest over 20 years?", expect: [[200], [92408.18, 92870.22]]}   # future_value(6, 20, monthly 200); start-of-month deposits ×1.005
- {id: c04, q: "Imagine you invest $10,000 in a retirement fund at an average annual interest rate of 8%, compounded annually. If you do not add any more money, how much will you have in the account after 10 years?", expect: [[21589.25]]}
- {id: c05, q: "What's the monthly payment on a $300,000 mortgage at 6.5% for 30 years?", expect: [[1896.20]]}
- {id: c06, q: "What is $10,000 received in 10 years worth today at a 5% discount rate?", expect: [[6139.13]]}
- {id: c07, q: "How long does it take to double my money at 7% a year?", expect: [[10.24, 10.29]]}   # exact; Rule of 72
- {id: c08, q: "If my investments return 7% and inflation is 3%, what is my real return?", expect: [[3.883, 4]]}   # exact; approximation
- {id: c09, q: "What APY does a 4.65% APR compounded monthly give?", expect: [[4.75]]}
- {id: c10, q: "I retire with $1,000,000 and withdraw $45,000 in the first year, raising the withdrawal 3% every year for inflation. If the portfolio earns 5% a year, how many years do the withdrawals last?", expect: [[28, 29, 30]]}   # by hand: 28 full withdrawals at the start of each year, 30 at the end
- {id: c11, q: "What's the IRR if I invest $10,000 and get back $3,000, $4,000 and $5,000 over three years?", expect: [[8.896]]}
- {id: c12, q: "If I invest $10,000 and want $15,000 in 5 years, what yearly return do I need?", expect: [[8.447]]}
- {id: c13, q: "What will $1,000 be worth in today's money after 10 years of 3% inflation?", expect: [[744.09]]}
- {id: c14, q: "A bond pays a $50 coupon each year and trades at $950. What is its current yield?", expect: [[5.263]]}
- {id: c15, q: "I owe $5,000 on a credit card at 18% APR and pay $200 a month. How many months until it's paid off?", expect: [[31.57, 31, 32]]}   # by hand: n = -ln(1 - rB/P)/ln(1+r), r = 1.5%; 31 full payments + a partial one
- {id: c16, q: "What is Retirement Income Sustainability? You retire with a $1,000,000 portfolio. You want to withdraw $45,000 (4.5%) in your first year, adjusting that dollar amount upward every year to match a 3% annual inflation rate.", expect: []}   # the return isn't given: any plan that runs (with a sample return) passes
- {id: c17, q: "How much will my savings grow?", status: need_info}
- {id: c18, q: "A future homebuyer determines they will need a $40,000 down payment to purchase a house exactly 5 years from today. If they plan to lock their money into a high-yield savings account earning a fixed 4% annual interest rate, how much money must they deposit as a single lump sum today to reach their goal?", expect: [[32877.08]]}   # present_value(40000, 4, 5)
- {id: c19, q: "An individual stores $10,000 in physical cash under a mattress. The money sits untouched for 20 years. Assuming the economy experiences a steady, average inflation rate of 3% per year, what will the actual purchasing power of that $10,000 be at the end of the 20-year period when measured in today's dollars?", expect: [[5536.76]]}   # purchasing_power(10000, 3, 20)
- {id: c20, q: "A consumer has an outstanding credit card balance of $5,000 at a 20% APR. If the minimum monthly payment is set at 3% of the remaining balance, and the consumer only pays the minimum amount each month without making new purchases, approximately how many years will it take to pay off the debt, and what will the total interest paid be?", expect: []}   # a balance paid down by 3% of itself never reaches 0: the answer depends on the stop rule or a minimum-payment floor (by hand, stopping below $1: 612 months, 51 years, $6,022.90 interest), so any plan that runs passes
- {id: c21, q: "An employee receives a $5,000 year-end bonus and decides to use it to clear a portion of their student loan balance, which currently stands at $15,000 with a fixed 6.5% interest rate. If making this single $5,000 lump-sum payment immediately drops the principal balance to $10,000, and they continue making their standard monthly payments, how much money will they save in total lifetime interest charges over the remaining 10-year term of the loan?", expect: [[3370.38, 1812.88]]}   # loan_payment(15000, 6.5, 10) = 170.32/month, $5,438.64 interest; keeping $170.32 on $10,000 pays it off in 71 months with $2,068.26 interest (by hand); re-amortising $10,000 over 10 years: $3,625.76
- {id: c22, q: "A worker plans to buy a used car for $18,000. The dealership offers them a 5-year auto loan at an 8% APR, which requires a monthly payment of $365. Alternatively, if they delay the purchase by 2 years, keep their current car, and save $700 each month in a high-yield savings account earning a 4% annual interest rate, how much total cash will they have accumulated, and will it be enough to buy the car outright with cash instead of taking on debt?", expect: [[17460.02, 17518.22], [-539.98, -481.78]]}   # future_value(4, 2, monthly 700) = 17,460.02 (start-of-month deposits: 17,518.22); short of $18,000; the loan's numbers are background
- {id: c23, q: "Can you show me an example of how to calculate WACC?", expect: []}   # a worked example with sample numbers: any plan that runs passes (c17, which asks about the user's own savings, must still ask)
- {id: c24, q: "If a stock has a beta of 1.2, what would its expected return be if the market return is 8%?", expect: [[9.4, 9.3, 9.2, 9.1, 9.0, 8.9, 8.8, 8.7, 8.6]]}   # CAPM rf + 1.2 × (8% − rf); the risk-free rate isn't given: a sample rate of 1% to 5%
- {id: c25, q: "show me example of CAPM?", expect: []}   # a worked example with sample numbers: any plan that runs passes
- {id: c26, q: "How much will $5,000 grow to at 8% a year over 15 years?", expect: [[15860.85]]}   # future_value(8, 15, 5000)
