# Markets that aren't a company: currencies, crypto, commodities, rates, indices and sectors, as Yahoo symbols.
# Read by src/rag/markets.py; mds/market-symbols.md records how each symbol was checked against Yahoo.
#
# Per group: label (how answers name it), aliases (what users call the whole group), news (Yahoo search terms for the
# group's headlines), symbols.
# Per symbol:
#   symbol   the Yahoo symbol the app sends (EURUSD=X, GC=F, ^TNX, BTC-USD)
#   name     how answers name it
#   aliases  what users write; matched exactly and embedded for meaning search, so keep them readable ("euro", "EUR/USD")
#   codes    joined-up forms matched exactly only ("eurusd"); they embed badly
#   news     the Yahoo search term that returns its headlines (the symbol itself when that works, a checked name when it
#            doesn't, null when Yahoo has no news for it: prices only)
#   etf      an ETF tracking it whose Yahoo news is richer, used when `news` finds too little

forex:
  label: currencies
  aliases: [forex, fx, currencies, currency markets, foreign exchange, exchange rates, currency exchange rates]
  news: [JPY=X, EURUSD=X, CNY=X, DXY]
  symbols:
    - {symbol: DX-Y.NYB, name: US Dollar Index, aliases: [US dollar index, dollar index, US dollar, greenback], codes: [dxy], news: DXY, etf: UUP}
