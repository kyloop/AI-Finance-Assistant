# US federal tax rules for the income-tax estimator (src/core/income_tax.py). One block per tax year; the estimator uses
# `default_year` unless asked for another. Filing statuses: single, married_joint, married_separate, head_of_household.
# 2026 sources (checked 2026-11-24):
#   IRS, "IRS releases tax inflation adjustments for tax year 2026, including amendments from the One, Big, Beautiful Bill"
#     (Rev. Proc. 2025-32): brackets, standard deduction, capital-gains breakpoints, SALT cap.
#     https://www.irs.gov/newsroom/irs-releases-tax-inflation-adjustments-for-tax-year-2026-including-amendments-from-the-one-big-beautiful-bill
#   SSA 2026 COLA fact sheet: Social Security wage base $184,500.
#   26 U.S.C. 1411 (net investment income tax) and 3101(b)(2) (additional Medicare tax): thresholds are not indexed.
#   Tax Foundation, "2026 Tax Brackets" (from Rev. Proc. 2025-32): head-of-household brackets, standard deduction and
#     capital-gains breakpoints, earned income credit table, child tax credit $2,200 / refundable $1,700, additional
#     standard deduction for 65+. https://taxfoundation.org/data/all/federal/2026-tax-brackets/
#   Married filing separately follows the single tables except the 35% bracket (ends at half the joint figure) and the
#     15% capital-gains band (half the joint figure); SALT cap, NIIT and additional-Medicare thresholds are half the joint.
#   P.L. 119-21 (One Big Beautiful Bill Act, 2025), 2025-2028: senior deduction, qualified tips and overtime, car-loan
#     interest; child and dependent care credit rate (26 U.S.C. 21 as amended). Statutory, not indexed.
#   26 U.S.C. 24 (child tax credit phase-out), 25A (education credits; phase-outs not indexed), 32 (earned income credit).
default_year: 2026
years:
  2026:
    brackets:                       # [upper bound of taxable income, rate]; null = no upper bound
      single: [[12400, 0.10], [50400, 0.12], [105700, 0.22], [201775, 0.24], [256225, 0.32], [640600, 0.35], [null, 0.37]]
      married_joint: [[24800, 0.10], [100800, 0.12], [211400, 0.22], [403550, 0.24], [512450, 0.32], [768700, 0.35], [null, 0.37]]
      married_separate: [[12400, 0.10], [50400, 0.12], [105700, 0.22], [201775, 0.24], [256225, 0.32], [384350, 0.35], [null, 0.37]]
      head_of_household: [[17700, 0.10], [67450, 0.12], [105700, 0.22], [201750, 0.24], [256200, 0.32], [640600, 0.35], [null, 0.37]]
    standard_deduction: {single: 16100, married_joint: 32200, married_separate: 16100, head_of_household: 24150}
    additional_standard_deduction: {unmarried: 2050, married: 1650}   # each person 65+ or blind (twice if both)
    capital_gains:                  # long-term gains and qualified dividends: [upper bound of taxable income, rate]
      single: [[49450, 0.0], [545500, 0.15], [null, 0.20]]
      married_joint: [[98900, 0.0], [613700, 0.15], [null, 0.20]]
      married_separate: [[49450, 0.0], [306850, 0.15], [null, 0.20]]
      head_of_household: [[66200, 0.0], [579600, 0.15], [null, 0.20]]
    capital_loss_limit: 3000        # net capital loss deductible against ordinary income per year
    salt:                           # state and local tax deduction (itemized): cap, reduced by 30% of MAGI above the threshold, never below the floor
      cap: 40400
      phase_down_start: 505000
      separate: {cap: 20200, phase_down_start: 252500, floor: 5000}   # married filing separately
      phase_down_rate: 0.30
      floor: 10000
    niit: {rate: 0.038, threshold: {single: 200000, married_joint: 250000, married_separate: 125000, head_of_household: 200000}}
    payroll:
      social_security_rate: 0.062
      social_security_wage_base: 184500
      medicare_rate: 0.0145
      additional_medicare_rate: 0.009
      additional_medicare_threshold: {single: 200000, married_joint: 250000, married_separate: 125000, head_of_household: 200000}
      self_employment_base: 0.9235  # share of net self-employment earnings that SE tax applies to
    new_deductions:                 # One Big Beautiful Bill Act, 2025-2028; taken with or without itemizing
      senior: {amount: 6000, phase_out_start: {single: 75000, married_joint: 150000, head_of_household: 75000}, rate: 0.06}
      tips: {cap: 25000, phase_out_start: {single: 150000, married_joint: 300000, head_of_household: 150000}, per_1000: 100}
      overtime: {cap: {single: 12500, married_joint: 25000, head_of_household: 12500},
                 phase_out_start: {single: 150000, married_joint: 300000, head_of_household: 150000}, per_1000: 100}
      car_loan_interest: {cap: 10000, phase_out_start: {single: 100000, married_joint: 200000, head_of_household: 100000}, per_1000: 200}
    credits:
      child: {amount: 2200, refundable: 1700, refundable_rate: 0.15, refundable_floor: 2500, other_dependent: 500,
              phase_out_start: {single: 200000, married_joint: 400000, married_separate: 200000, head_of_household: 200000},
              per_1000: 50}
      earned_income:                # by qualifying children (3 = three or more): credit rate, earned income amount,
        rates: {0: 0.0765, 1: 0.34, 2: 0.40, 3: 0.45}                # phase-out rate and start (joint start separately)
        earned_amount: {0: 8680, 1: 13020, 2: 18290, 3: 18290}
        max_credit: {0: 664, 1: 4427, 2: 7316, 3: 8231}
        phase_out_rate: {0: 0.0765, 1: 0.1598, 2: 0.2106, 3: 0.2106}
        phase_out_start: {0: 10860, 1: 23890, 2: 23890, 3: 23890}
        phase_out_start_joint: {0: 18140, 1: 31160, 2: 31160, 3: 31160}
      dependent_care: {expense_cap: {1: 3000, 2: 6000}, top_rate: 0.50, middle_rate: 0.35, floor_rate: 0.20,
                       first_start: 15000, first_step: 2000, second_start: {single: 75000, married_joint: 150000,
                       head_of_household: 75000}, second_step: {single: 2000, married_joint: 4000, head_of_household: 2000}}
      american_opportunity: {full: 2000, partial: 2000, partial_rate: 0.25, refundable_share: 0.40}
      lifetime_learning: {expense_cap: 10000, rate: 0.20}
      education_phase_out: {single: [80000, 90000], married_joint: [160000, 180000], head_of_household: [80000, 90000]}
